---
- name: Create server dockerhost
  netscaler.adc.server:
    nsip: "{{ nitro_nsip }}"
    nitro_user: "{{ nitro_user }}"
    nitro_pass: "{{ nitro_pass }}"
    nitro_protocol: http
    validate_certs: no

    state: present
    name: dockerhost.homelabdc22.local
    ipaddress: 192.168.5.10

- name: Import gitlabs sslcertfile
  delegate_to: localhost
  netscaler.adc.sslcertfile:
    nsip: "{{ nitro_nsip }}"
    nitro_user: "{{ nitro_user }}"
    nitro_pass: "{{ nitro_pass }}"
    nitro_protocol: https
    validate_certs: no

    state: imported
    name: gitlabs.homelabdc22.local.cer
    src: http://pki.homelabdc22.local/certstore/gitlabs.homelabdc22.local-20260728.cer

- name: Import gitlabs sslkeyfile
  delegate_to: localhost
  netscaler.adc.sslkeyfile:
    nsip: "{{ nitro_nsip }}"
    nitro_user: "{{ nitro_user }}"
    nitro_pass: "{{ nitro_pass }}"
    nitro_protocol: https
    validate_certs: no

    state: imported
    name: gitlabs.homelabdc22.local.key
    src: http://pki.homelabdc22.local/certstore/gitlabs.homelabdc22.local-20260728.key

- name: Create gitlabs certkey pair
  delegate_to: localhost
  netscaler.adc.sslcertkey:
    nsip: "{{ nitro_nsip }}"
    nitro_user: "{{ nitro_user }}"
    nitro_pass: "{{ nitro_pass }}"
    nitro_protocol: https
    validate_certs: no

    certkey: gitlabs.homelabdc22.local
    cert: gitlabs.homelabdc22.local.cer
    key: gitlabs.homelabdc22.local.key
    linkcertkeyname: homelab_issuing_CA

- name: Setup servicegroups gitlab
  netscaler.adc.servicegroup:
    nsip: "{{ nitro_nsip }}"
    nitro_user: "{{ nitro_user }}"
    nitro_pass: "{{ nitro_pass }}"
    nitro_protocol: http
    validate_certs: no

    servicegroupname: sg_gitlabs.homelabdc22.local
    servicetype: SSL
    healthmonitor: "YES"
    servicegroup_servicegroupmember_binding:
      binding_members:
        - servername: dockerhost.homelabdc22.local
          port: 8443
          servicegroupname: sg_gitlabs.homelabdc22.local

- name: Setup servicegroups gitlab http
  netscaler.adc.servicegroup:
    nsip: "{{ nitro_nsip }}"
    nitro_user: "{{ nitro_user }}"
    nitro_pass: "{{ nitro_pass }}"
    nitro_protocol: http
    validate_certs: no

    servicegroupname: sg_gitlabs.homelabdc22.local_80
    servicetype: SSL
    healthmonitor: "YES"
    servicegroup_servicegroupmember_binding:
      binding_members:
        - servername: dockerhost.homelabdc22.local
          port: 8080
          servicegroupname: sg_gitlabs.homelabdc22.local_80


- name: Create loadbalancer gitlabs
  netscaler.adc.lbvserver:
    nsip: "{{ nitro_nsip }}"
    nitro_user: "{{ nitro_user }}"
    nitro_pass: "{{ nitro_pass }}"
    nitro_protocol: http
    validate_certs: no

    state: present
    name: vslb_gitlabs.homelabdc22.local
    servicetype: SSL
    ipv46: 192.168.5.85
    port: 443
    lbmethod: LEASTCONNECTION
    lbvserver_servicegroup_binding:
      binding_members:
        - name: vslb_gitlabs.homelabdc22.local
          servicename: sg_gitlabs.homelabdc22.local_80

- name: Create loadbalancer gitlabs http
  netscaler.adc.lbvserver:
    nsip: "{{ nitro_nsip }}"
    nitro_user: "{{ nitro_user }}"
    nitro_pass: "{{ nitro_pass }}"
    nitro_protocol: http
    validate_certs: no

    state: present
    name: vslb_gitlabs.homelabdc22.local_80
    servicetype: HTTP
    ipv46: 192.168.5.85
    port: 80
    lbmethod: LEASTCONNECTION
    lbvserver_servicegroup_binding:
      binding_members:
        - name: vslb_gitlabs.homelabdc22.local_80
          servicename: sg_gitlabs.homelabdc22.local_80
