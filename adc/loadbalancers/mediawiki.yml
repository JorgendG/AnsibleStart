---
- name: Create server docker-ubuntu
  netscaler.adc.server:
    nsip: "{{ nitro_nsip }}"
    nitro_user: "{{ nitro_user }}"
    nitro_pass: "{{ nitro_pass }}"
    nitro_protocol: http
    validate_certs: no

    state: present

    name: docker-ubuntu.homelabdc22.local
    ipaddress: 192.168.1.141

- name: Create servicegroup sg_mediawiki.homelabdc22.local
  netscaler.adc.servicegroup:
    nsip: "{{ nitro_nsip }}"
    nitro_user: "{{ nitro_user }}"
    nitro_pass: "{{ nitro_pass }}"
    nitro_protocol: http
    validate_certs: no

    servicegroupname: sg_mediawiki.homelabdc22.local
    servicetype: HTTP
    healthmonitor: "YES"
    servicegroup_servicegroupmember_binding:
      binding_members:
        - servername: docker-ubuntu.homelabdc22.local
          port: 8090
          servicegroupname: sg_mediawiki.homelabdc22.local

- name: Create loadbalancer vslb_mediawiki.homelabdc22.local
  netscaler.adc.lbvserver:
    nsip: "{{ nitro_nsip }}"
    nitro_user: "{{ nitro_user }}"
    nitro_pass: "{{ nitro_pass }}"
    nitro_protocol: http
    validate_certs: no

    state: present
    name: vslb_mediawiki.homelabdc22.local
    servicetype: HTTP
    ipv46: 192.168.10.20
    port: 80
    lbmethod: LEASTCONNECTION
    lbvserver_servicegroup_binding:
      binding_members:
        - name: vslb_mediawiki.homelabdc22.local
          servicename: sg_mediawiki.homelabdc22.local
