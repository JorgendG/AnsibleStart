---
- name: Set modes
  netscaler.adc.nsmode:
    nsip: "{{ nitro_nsip }}"
    nitro_user: "{{ nitro_user }}"
    nitro_pass: "{{ nitro_pass }}"
    nitro_protocol: https
    validate_certs: no

    mode: "{{item}}"
    state: enabled
  with_items:
    - "FR"
    - "L3"
    - "Edge"
    - "USNIP"
    - "PMTUD"

- name: Set modfeature
  netscaler.adc.nsfeature:
    nsip: "{{ nitro_nsip }}"
    nitro_user: "{{ nitro_user }}"
    nitro_pass: "{{ nitro_pass }}"
    nitro_protocol: https
    validate_certs: no

    feature: "{{item}}"
    state: enabled
  with_items:
    - "WL"
    - "LB"
    - "SSL"
    - "AppFlow"
    - "CH"
